function loadSave() {
  try {
    const raw = localStorage.getItem('voidcat_save');
    if (raw) {
      const p = JSON.parse(raw);
      save = Object.assign({}, DEFAULT_SAVE, p);
      if (!Array.isArray(save.unlockedSkins)) save.unlockedSkins = ['default'];
      if (!Array.isArray(save.unlockedAccessories)) save.unlockedAccessories = ['none'];

}
function writeSave() {
  try { localStorage.setItem('voidcat_save', JSON.stringify(save)); } catch (e) {}

const Sound = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  playing: false, padTimer: null, arpTimer: null, chordIndex: 0,
  progression: [
    [45, 57, 60, 64],
    [41, 53, 57, 60],
    [48, 55, 60, 64],
    [43, 55, 59, 62]
  ],

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.34;
      this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.45;
      this.sfxGain.connect(this.master);
    } catch (e) { this.ctx = null; }
  },

  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  },

  playPad(notes, dur) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    notes.forEach((m, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = i === 0 ? 'sine' : 'triangle';
      osc.frequency.value = midiToFreq(m);
      osc.detune.value = (i - 1) * 4;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.09 / (i * 0.6 + 1), now + 2.6);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g); g.connect(this.musicGain);
      osc.start(now); osc.stop(now + dur + 0.2);
    });
  },

  playPluck() {
    if (!this.ctx) return;
    const scale = [69, 72, 74, 76, 79, 81, 84, 86, 88];
    const m = scale[Math.floor(Math.random() * scale.length)];
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = midiToFreq(m);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.055, now + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
    osc.connect(g); g.connect(this.musicGain);
    osc.start(now); osc.stop(now + 2.6);
  },

  startMusic() {
    this.resume();
    if (!this.ctx || this.playing) return;
    this.playing = true;
    this.chordIndex = 0;
    const next = () => {
      if (!this.playing || !this.ctx) return;
      this.playPad(this.progression[this.chordIndex % this.progression.length], 9.5);
      this.chordIndex++;
      this.padTimer = setTimeout(next, 8000);
    };
    next();
    this.arpTimer = setInterval(() => {
      if (this.playing && Math.random() < 0.6) this.playPluck();
    }, 750);
  },

  stopMusic() {
    this.playing = false;
    if (this.padTimer) clearTimeout(this.padTimer);
    if (this.arpTimer) clearInterval(this.arpTimer);
    this.padTimer = this.arpTimer = null;
  },

  sfxJump() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.06, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(now); osc.stop(now + 0.22);
  },

  sfxCollect() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [84, 88, 91].forEach((m, i) => {
      const t0 = now + i * 0.05;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = midiToFreq(m);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.13, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
      osc.connect(g); g.connect(this.sfxGain);
      osc.start(t0); osc.stop(t0 + 0.9);
    });
  },

  sfxComplete() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [60, 64, 67, 72, 76].forEach((m, i) => {
      const t0 = now + i * 0.09;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = midiToFreq(m);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
      osc.connect(g); g.connect(this.sfxGain);
      osc.start(t0); osc.stop(t0 + 2.3);
    });
  }
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

function makeStars(n) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    arr.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(0.4, 1.9),
      p: Math.random() * Math.PI * 2,
      s: rand(0.5, 2.2)
    });
  }
  return arr;
}

function spawnBurst(x, y, count, colors) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(0.8, 4.5);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1,
      life: rand(30, 70),
      maxLife: 70,
      size: rand(1.5, 4),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateParticles(dt) {
  const arr = state.particles;
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.965;
    p.vy = p.vy * 0.965 + 0.045 * dt;
    p.life -= dt;
    if (p.life <= 0) arr.splice(i, 1);
  }
}

  c.fill();
  c.beginPath();
  c.moveTo(16, -20);

function drawBackground(t, palette, nebulaPalette) {
  const bg = palette || MENU_BG;
  const neb = nebulaPalette || MENU_NEB;

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, bg[0]);
  g.addColorStop(0.55, bg[1]);
  g.addColorStop(1, bg[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const bx = 0.5 + Math.sin(t * 0.07) * 0.22;
  const by = 0.42 + Math.cos(t * 0.05) * 0.14;
  const rg = ctx.createRadialGradient(W * bx, H * by, 0, W * bx, H * by, W * 0.62);
  rg.addColorStop(0, `rgba(${neb[0]},0.22)`);
  rg.addColorStop(1, `rgba(${neb[0]},0)`);
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const rg2 = ctx.createRadialGradient(W * (1 - bx), H * (1 - by), 0, W * (1 - bx), H * (1 - by), W * 0.55);
  rg2.addColorStop(0, `rgba(${neb[1]},0.16)`);
  rg2.addColorStop(1, `rgba(${neb[1]},0)`);
  ctx.fillStyle = rg2;
  ctx.fillRect(0, 0, W, H);

  const stars = state.bgStars;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * s.s + s.p));
    ctx.fillStyle = `rgba(220,230,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

   УРОВЕНЬ: РИСОВАНИЕ
============================================================ */
function drawPlatforms(level) {
  for (const p of level.platforms) {
    const isGround = p.h > 30;
    const grad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    grad.addColorStop(0, isGround ? 'rgba(70,80,150,0.85)' : 'rgba(80,95,180,0.9)');
    grad.addColorStop(1, isGround ? 'rgba(20,25,55,0.95)' : 'rgba(25,30,70,0.9)');
    ctx.fillStyle = grad;
    const r = isGround ? 0 : 9;
    roundRect(ctx, p.x, p.y, p.w, p.h, r);
    ctx.fill();

    ctx.strokeStyle = 'rgba(150,180,255,0.85)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(140,170,255,0.9)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(p.x + r, p.y + 1);
    ctx.lineTo(p.x + p.w - r, p.y + 1);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function roundRect(c, x, y, w, h, r) {
  if (r > 0) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  } else {
    c.beginPath();
    c.rect(x, y, w, h);
  }
}

function drawOrbs(level, t) {
  for (const orb of level.orbs) {
    if (orb.collected) continue;
    const bob = Math.sin(t * 2 + orb.phase) * 4;
    const x = orb.x;
    const y = orb.y + bob;
    const pulse = 0.85 + Math.sin(t * 3.4 + orb.phase) * 0.15;

    const rg = ctx.createRadialGradient(x, y, 0, x, y, 30 * pulse);
    rg.addColorStop(0, 'rgba(255,255,235,0.95)');
    rg.addColorStop(0.28, 'rgba(190,225,255,0.6)');
    rg.addColorStop(0.6, 'rgba(140,170,255,0.2)');
    rg.addColorStop(1, 'rgba(120,150,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, 30 * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.beginPath();
    ctx.arc(x, y, 4.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.4;
    const L = 11 * pulse;
    ctx.beginPath();
    ctx.moveTo(x - L, y); ctx.lineTo(x + L, y);
    ctx.moveTo(x, y - L); ctx.lineTo(x, y + L);
    ctx.stroke();
  }
}

function drawParticles() {
  for (const p of state.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function startLevel(i) {
  // сохраняем прогресс
  save.currentLevel = i;
  writeSave();

  const data = LEVELS[i];
  state.levelIndex = i;
  state.level = {

    nebula: data.nebula,
    platforms: data.platforms.map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h })),
    orbs: data.orbs.map(o => ({
      x: o.x, y: o.y, collected: false, phase: Math.random() * Math.PI * 2
    }))
  };

  state.cat = {
    x: 80,
    y: 545 - FEET,
    vx: 0,
    vy: 0,
    facing: 1,
    onGround: true,
    blinkT: 2 + Math.random() * 2,
    blinkDur: 0,
    blinking: false,
    glow: 0
  };

  state.collected = 0;
  state.total = state.level.orbs.length;
  state.particles = [];
  state.completing = false;
  state.completeT = 0;
  state.completeShown = false;
  state.bgStars = makeStars(160);

  state.scene = 'play';
  state.sceneT = 0;

  $('complete').classList.add('hidden');
  showHUD(true);
  updateHUD();
}

function updateCat(dt, allowInput) {
  const cat = state.cat;
  const L = state.level;
  if (!cat || !L) return;

  let move = 0;
  if (allowInput) {
    if (keys['ArrowLeft'] || keys['KeyA'] || keys['vLeft']) move -= 1;
    if (keys['ArrowRight'] || keys['KeyD'] || keys['vRight']) move += 1;
  }

  cat.vx = move * MOVE_SPEED;
  if (move !== 0) cat.facing = move;

  cat.x += cat.vx * dt;
  cat.x = clamp(cat.x, 24, W - 24);

  const wantJump = allowInput && (keys['ArrowUp'] || keys['KeyW'] || keys['Space'] || keys['vJump']);
  if (wantJump && cat.onGround) {
    cat.vy = JUMP_VEL;
    cat.onGround = false;
    Sound.sfxJump();
  }

  cat.vy += GRAVITY * dt;
  if (cat.vy > 18) cat.vy = 18;

  const prevBottom = cat.y + FEET;
  cat.y += cat.vy * dt;
  const bottom = cat.y + FEET;

  cat.onGround = false;
  if (cat.vy >= 0) {
    for (const p of L.platforms) {
      if (prevBottom <= p.y + 0.6 && bottom >= p.y &&
          cat.x + 16 > p.x && cat.x - 16 < p.x + p.w) {
        cat.y = p.y - FEET;
        cat.vy = 0;
        cat.onGround = true;
        break;
      }
    }
  }

  cat.blinkT -= dt / 60;
  if (cat.blinkT <= 0) {
    cat.blinking = true;
    cat.blinkDur = 0.13;
    cat.blinkT = 2 + Math.random() * 3;
  }
  if (cat.blinking) {
    cat.blinkDur -= dt / 60;
    if (cat.blinkDur <= 0) cat.blinking = false;
  }
}

function checkOrbs() {
  const cat = state.cat;
  const L = state.level;
  if (!cat || !L) return;

  for (const orb of L.orbs) {
    if (orb.collected) continue;
    const dx = cat.x - orb.x;
    const dy = (cat.y - 4) - orb.y;
    if (dx * dx + dy * dy < 34 * 34) {
      orb.collected = true;
      state.collected++;
      const skin = getSkin(save.skin);
      spawnBurst(orb.x, orb.y, 16, [
        '#ffffff',
        `rgb(${skin.glowRGB})`,
        '#ffe066',
        '#a8c8ff'
      ]);
      Sound.sfxCollect();
      updateHUD();
    }
  }
}

function startComplete() {
  state.completing = true;
  state.completeT = 0;
  state.completeShown = false;
  Sound.sfxComplete();
  const cat = state.cat;
  spawnBurst(cat.x, cat.y - 4, 50, ['#ffffff', '#ffe066', '#a8c8ff', '#ffb3e6']);
}

function finishLevel() {
  const gained = state.total;
  save.totalOrbs += gained;

  const newSkins = [];
  const newAcc = [];
  for (const s of SKINS) {
    if (save.totalOrbs >= s.req && !save.unlockedSkins.includes(s.id)) {
      save.unlockedSkins.push(s.id);
      newSkins.push(s.name);
    }
  }
  for (const a of ACCESSORIES) {
    if (save.totalOrbs >= a.req && !save.unlockedAccessories.includes(a.id)) {
      save.unlockedAccessories.push(a.id);
      newAcc.push(a.name);
    }
  }
  writeSave();

  const isLast = state.levelIndex >= LEVELS.length - 1;
  $('completeTitle').textContent = isLast ? 'Все осколки собраны!' : 'Уровень пройден!';
  $('completeText').innerHTML =
    `Собрано осколков: <b>${gained}</b><br>Всего осколков: <b>${save.totalOrbs}</b><br>` +
    `Уровень <b>${state.levelIndex + 1}</b> из <b>${LEVELS.length}</b>`;

  let unlockMsg = '';
  if (newSkins.length) unlockMsg += '✦ Новый скин: ' + newSkins.join(', ') + '<br>';
  if (newAcc.length) unlockMsg += '✦ Новый аксессуар: ' + newAcc.join(', ');
  $('unlockText').innerHTML = unlockMsg;

  $('btnNext').textContent = isLast ? 'К финалу' : 'Далее';
  $('complete').classList.remove('hidden');
  showHUD(false);
  showControls(false);
  state.scene = 'complete';
  updateTotalOrbsDisplay();
}

/* ============================================================
   HUD
============================================================ */
function showHUD(on) { $('hud').classList.toggle('hidden', !on); }
function showControls(on) { $('controls').classList.toggle('hidden', !on); }

function updateHUD() {
  if (!state.level) return;
  $('levelName').textContent = state.level.name;
  $('orbCount').textContent = `${state.collected} / ${state.total}`;
  const pct = state.total > 0 ? (state.collected / state.total) * 100 : 0;
  $('glowBar').style.width = pct + '%';
}

function updateTotalOrbsDisplay() {
  $('totalOrbs').textContent = save.totalOrbs;
  const lp = $('levelProgress');
  if (lp) {
    if (save.currentLevel > 0 && save.currentLevel < LEVELS.length) {
      lp.textContent = `| Уровень ${save.currentLevel + 1}/${LEVELS.length}`;
    } else {
      lp.textContent = '';
    }
  }
}

/* ---- Кнопки меню: «Играть» / «Продолжить» ---- */
function updatePlayButton() {
  const btn = $('btnPlay');
  if (save.currentLevel > 0 && save.currentLevel < LEVELS.length) {
    btn.textContent = 'Начать заново';
  } else {
    btn.textContent = 'Играть';
  }
}

function updateContinueButton() {
  const btn = $('btnContinue');
  if (save.currentLevel > 0 && save.currentLevel < LEVELS.length) {
    btn.textContent = `Продолжить (ур. ${save.currentLevel + 1})`;
    btn.classList.remove('hidden');
  } else {
    btn.classList.add('hidden');
  }
}

function refreshMenuButtons() {
  updatePlayButton();
  updateContinueButton();
  updateTotalOrbsDisplay();
}

/* ============================================================
   КАТ-СЦЕНЫ
============================================================ */
function startCutscene(lines, onEnd) {
  state.scene = 'cutscene';
  state.sceneT = 0;
  state.cutscene = {
    lines: lines.slice(),
    index: 0,
    charIndex: 0,
    acc: 0,
    typing: true,
    textEl: $('csText'),
    onEnd
  };
  $('csText').textContent = '';
  $('cutscene').classList.remove('hidden');
  showHUD(false);
  showControls(false);
}

function advanceCutscene() {
  const cs = state.cutscene;
  if (!cs) return;

  if (cs.typing) {
    cs.charIndex = cs.lines[cs.index].length;
    cs.textEl.textContent = cs.lines[cs.index];
    cs.typing = false;
    return;
  }

  cs.index++;
  if (cs.index >= cs.lines.length) {
    endCutscene();
  } else {
    cs.charIndex = 0;
    cs.acc = 0;
    cs.typing = true;
    cs.textEl.textContent = '';
  }
}

function endCutscene() {
  const cs = state.cutscene;
  $('cutscene').classList.add('hidden');
  state.cutscene = null;
  if (cs && typeof cs.onEnd === 'function') cs.onEnd();
}

function updateCutscene(dt) {
  const cs = state.cutscene;
  if (!cs || !cs.typing) return;
  const line = cs.lines[cs.index];
  cs.acc += dt * 0.95;
  const n = Math.floor(cs.acc);
  if (n > 0) {
    cs.acc -= n;
    cs.charIndex = Math.min(cs.charIndex + n, line.length);
    cs.textEl.textContent = line.slice(0, cs.charIndex);
    if (cs.charIndex >= line.length) cs.typing = false;
  }
}

/* ============================================================
   СКИНЫ
============================================================ */
function openSkins() {
  state.scene = 'skins';
  buildSkinCards();
  $('menu').classList.add('hidden');
  $('skins').classList.remove('hidden');
}

function buildSkinCards() {
  const skinList = $('skinList');
  const accList = $('accList');
  skinList.innerHTML = '';
  accList.innerHTML = '';

  SKINS.forEach(s => {
    const unlocked = save.unlockedSkins.includes(s.id);
    const card = document.createElement('div');
    card.className = 'card' + (unlocked ? '' : ' locked') +
                     (save.skin === s.id ? ' selected' : '');

    const cv = document.createElement('canvas');
    cv.width = 140; cv.height = 140;
    const c = cv.getContext('2d');
    c.save();
    c.translate(76, 92);
    c.scale(1.18, 1.18);
    drawCatShape(c, { skin: s, accessory: 'none', time: 0.6, facing: 1, blink: false, glow: 0 });
    c.restore();
    card.appendChild(cv);

    const nm = document.createElement('div');
    nm.className = 'cname';
    nm.textContent = s.name;
    card.appendChild(nm);

    const rq = document.createElement('div');
    rq.className = 'creq';
    rq.textContent = unlocked ? '✓' : `${s.req} ✦`;
    card.appendChild(rq);

    if (!unlocked) {
      const lock = document.createElement('div');
      lock.className = 'lock-icon';
      lock.textContent = '🔒';
      card.appendChild(lock);
    } else {
      card.addEventListener('click', () => {
        save.skin = s.id;
        writeSave();
        buildSkinCards();
      });
    }
    skinList.appendChild(card);
  });

  ACCESSORIES.forEach(a => {
    const unlocked = save.unlockedAccessories.includes(a.id);
    const card = document.createElement('div');
    card.className = 'card' + (unlocked ? '' : ' locked') +
                     (save.accessory === a.id ? ' selected' : '');

    const cv = document.createElement('canvas');
    cv.width = 140; cv.height = 140;
    const c = cv.getContext('2d');
    c.save();
    c.translate(76, 92);
    c.scale(1.18, 1.18);
    drawCatShape(c, { skin: getSkin(save.skin), accessory: a.id, time: 0.6, facing: 1, blink: false, glow: 0 });
    c.restore();
    card.appendChild(cv);

    const nm = document.createElement('div');
    nm.className = 'cname';
    nm.textContent = a.name;
    card.appendChild(nm);

    const rq = document.createElement('div');
    rq.className = 'creq';
    rq.textContent = unlocked ? '✓' : `${a.req} ✦`;
    card.appendChild(rq);

    if (!unlocked) {
      const lock = document.createElement('div');
      lock.className = 'lock-icon';
      lock.textContent = '🔒';
      card.appendChild(lock);
    } else {
      card.addEventListener('click', () => {
        save.accessory = a.id;
        writeSave();
        buildSkinCards();
      });
    }
    accList.appendChild(card);
  });
}

/* ============================================================
   ВВОД
============================================================ */
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
  keys[e.code] = true;
}, { passive: false });

window.addEventListener('keyup', e => {
  keys[e.code] = false;
});

function bindHoldButton(el, key) {
  const on = e => {
    e.preventDefault();
    keys[key] = true;
    el.classList.add('active');
    Sound.resume();
  };
  const off = e => {
    if (e) e.preventDefault();
    keys[key] = false;
    el.classList.remove('active');
  };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

bindHoldButton($('btnLeft'), 'vLeft');
bindHoldButton($('btnRight'), 'vRight');
bindHoldButton($('btnJump'), 'vJump');

/* ============================================================
   ОБРАБОТЧИКИ UI
============================================================ */
function blurActive() {
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
}

/* «Играть» — начать заново с уровня 1 (сбрасывает прогресс) */
$('btnPlay').addEventListener('click', () => {
  blurActive();
  Sound.startMusic();
  save.currentLevel = 0;
  writeSave();
  $('menu').classList.add('hidden');
  startCutscene(STORY_INTRO, () => {
    startLevel(0);
    showControls(true);
  });
  showControls(false);
});

/* «Продолжить» — с сохранённого уровня (без кат-сцены) */
$('btnContinue').addEventListener('click', () => {
  blurActive();
  Sound.startMusic();
  $('menu').classList.add('hidden');
  if (save.currentLevel >= LEVELS.length) save.currentLevel = 0;
  startLevel(save.currentLevel);
  showControls(true);
});

$('btnSkins').addEventListener('click', () => {
  blurActive();
  Sound.resume();
  openSkins();
});

$('btnExit').addEventListener('click', () => {
  blurActive();
  Sound.resume();
  const menu = $('menu');
  menu.innerHTML = `
    <h1>VOID<span>CAT</span></h1>
    <p class="subtitle">Спасибо, что играл. TAVI будет ждать тебя среди звёзд. ✦</p>
    <button id="btnReturn">Вернуться</button>
  `;
  menu.querySelector('#btnReturn').addEventListener('click', () => location.reload());
});

$('btnSkinsBack').addEventListener('click', () => {
  blurActive();
  $('skins').classList.add('hidden');
  $('menu').classList.remove('hidden');
  state.scene = 'menu';
  refreshMenuButtons();
});

$('btnMenu').addEventListener('click', () => {
  blurActive();
  Sound.resume();
  state.scene = 'menu';
  state.level = null;
  state.cat = null;
  state.particles = [];
  showHUD(false);
  showControls(false);
  $('menu').classList.remove('hidden');
  refreshMenuButtons();
});

$('btnNext').addEventListener('click', () => {
  blurActive();
  Sound.resume();
  $('complete').classList.add('hidden');

  const isLast = state.levelIndex >= LEVELS.length - 1;
  if (isLast) {
    startCutscene(STORY_END, () => {
      save.currentLevel = 0;   // ← игра пройдена, сбрасываем прогресс
      writeSave();
      state.scene = 'menu';
      state.level = null;
      state.cat = null;
      state.bgStars = makeStars(160);
      showHUD(false);
      showControls(false);
      $('menu').classList.remove('hidden');
      refreshMenuButtons();
    });
  } else {
    startLevel(state.levelIndex + 1);
    showControls(true);
  }
});

$('cutscene').addEventListener('click', (e) => {
  if (e.target.id === 'csSkip') return;
  advanceCutscene();
});

$('csSkip').addEventListener('click', (e) => {
  e.stopPropagation();
  endCutscene();
});

/* ============================================================
   ИГРОВОЙ ЦИКЛ
============================================================ */
let lastTs = 0;

function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 16.667;
  lastTs = ts;
  dt = clamp(dt, 0, 3);

  const t = ts / 1000;

  update(dt, t);
  render(t);

  requestAnimationFrame(loop);
}

function update(dt, t) {
  state.sceneT += dt;
  updateParticles(dt);

  if (state.scene === 'cutscene') {
    updateCutscene(dt);
  }

  if (state.scene === 'play') {
    if (!state.completing) {
      updateCat(dt, true);
      checkOrbs();
      if (state.total > 0 && state.collected >= state.total) {
        startComplete();
      }
    } else {
      updateCat(dt, false);
      state.completeT += dt;
      const cat = state.cat;
      cat.glow = Math.min(1.2, cat.glow + dt * 0.022);
      if (Math.random() < 0.25) {
        spawnBurst(
          cat.x + rand(-16, 16),
          cat.y + rand(-22, 16),
          1,
          ['#ffffff', '#ffe066', '#a8c8ff']
        );
      }
      if (state.completeT > 95 && !state.completeShown) {
        state.completeShown = true;
        finishLevel();
      }
    }
  }
}

function render(t) {
  const scene = state.scene;

  if (scene === 'play' || scene === 'complete') {
    const L = state.level;
    drawBackground(t, L.bg, L.nebula);
    drawPlatforms(L);
    drawOrbs(L, t);
    drawParticles();

    const cat = state.cat;
    if (cat) {
      ctx.save();
      ctx.translate(cat.x, cat.y);
      drawCatShape(ctx, {
        skin: getSkin(save.skin),
        accessory: save.accessory,
        time: t,
        facing: cat.facing,
        blink: cat.blinking,
        glow: cat.glow
      });
      ctx.restore();
    }
  } else {
    drawBackground(t, MENU_BG, MENU_NEB);

    const floatY = Math.sin(t * 1.1) * 12;
    ctx.save();
    ctx.globalAlpha = scene === 'cutscene' ? 0.35 : 0.9;
    ctx.translate(W / 2, H * 0.5 + floatY);
    ctx.scale(2.1, 2.1);
    drawCatShape(ctx, {
      skin: getSkin(save.skin),
      accessory: save.accessory,
      time: t,
      facing: 1,
      blink: false,
      glow: 0.35 + Math.sin(t * 1.6) * 0.15
    });
    ctx.restore();
  }
}

/* ============================================================
   СТАРТ
============================================================ */
loadSave();
state.bgStars = makeStars(160);
refreshMenuButtons();
$('menu').classList.remove('hidden');

const unlockAudio = () => {
  Sound.resume();
  Sound.startMusic();
  window.removeEventListener('pointerdown', unlockAudio);
  window.removeEventListener('keydown', unlockAudio);
};
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);

requestAnimationFrame(loop);
</script>
